<script>
(function () {
  'use strict';
  var TOOLS = window.SAAGAR_TOOLS || [];
  var list = document.getElementById('tList');
  var filter = document.getElementById('tFilter');
  var count = document.getElementById('tCount');

  function draw(q) {
    q = (q || '').trim().toLowerCase();
    list.innerHTML = '';
    var shown = 0;
    var groups = [];
    TOOLS.forEach(function (t) {
      if (q && (t.name + ' ' + t.blurb + ' ' + t.kw + ' ' + t.group).toLowerCase().indexOf(q) === -1) return;
      if (groups.indexOf(t.group) === -1) groups.push(t.group);
    });
    groups.forEach(function (g) {
      var head = document.createElement('div');
      head.className = 'gtitle';
      head.textContent = g;
      list.appendChild(head);
      var grid = document.createElement('div');
      grid.className = 'tiles';
      TOOLS.forEach(function (t) {
        if (t.group !== g) return;
        if (q && (t.name + ' ' + t.blurb + ' ' + t.kw + ' ' + t.group).toLowerCase().indexOf(q) === -1) return;
        var a = document.createElement('a');
        a.className = 'tile';
        a.href = t.file;
        a.innerHTML = '<div class="ic">' + t.icon + '</div><h3>' + t.name + '</h3><p>' + t.blurb + '</p><span class="go">Open →</span>';
        grid.appendChild(a);
        shown++;
      });
      list.appendChild(grid);
    });
    count.textContent = shown + ' of ' + TOOLS.length + ' tools';
    if (!shown) list.innerHTML = '<div class="card center"><p class="muted">Nothing matches that filter.</p></div>';
  }

  filter.addEventListener('input', function () { draw(this.value); });
  draw('');
})();
</script>

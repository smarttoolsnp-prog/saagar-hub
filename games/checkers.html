  .cwrap{width:100%; max-width:560px; margin:0 auto; padding:16px; border-radius:32px;

  .sq.l{background:linear-gradient(135deg,#fde68a,#fbc75d);}
  .sq.d{background:linear-gradient(135deg,#b45309,#92400e);}
  .sq.play{cursor:pointer;}
  .sq.play::after{content:""; position:absolute; inset:12%; border-radius:50%; box-shadow:0 0 0 3px rgba(255,236,150,.9) inset; opacity:.9;}
  .sq.hint::before{content:""; position:absolute; width:26%; height:26%; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .sq.cap::before{content:""; position:absolute; width:26%; height:26%; border-radius:50%; background:rgba(225,29,72,.95); box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .sq.sel{box-shadow:inset 0 0 0 4px #fff3c4;}
  .pc{width:76%; height:76%; border-radius:50%; position:relative; transition:transform .16s, box-shadow .16s;}
  .pc.r{background:radial-gradient(circle at 34% 30%,#fca5a5,#ef4444 58%,#b91c1c);box-shadow:0 5px 12px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.55), inset 0 -4px 7px rgba(0,0,0,.28);}
  .pc.b{background:radial-gradient(circle at 34% 30%,#6366f1,#312e81 58%,#1e1b4b);box-shadow:0 5px 12px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -4px 7px rgba(0,0,0,.35);}
  .pc::after{content:""; position:absolute; inset:17%; border-radius:50%; box-shadow:inset 0 0 0 6% rgba(255,255,255,.32);}
  .pc.king::before{content:""; position:absolute; inset:0; display:grid; place-items:center;
    background:none;
    -webkit-mask-image:none; mask-image:none;}
  .pc.king::after{content:""; position:absolute; inset:17%; border-radius:50%; box-shadow:inset 0 0 0 6% rgba(251,191,36,.85);}
  .pc.king svg{position:absolute; inset:0; margin:auto; width:46%; height:46%; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
  .cbar{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:15px;}
  .sc2{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
  .sc2 div{background:var(--card); border:none; border-radius:999px; padding:8px 16px;
    font-size:13px; font-weight:800; color:var(--navy-ink); box-shadow:var(--sh-clay); display:flex; align-items:center; gap:8px;}
  .sc2 i{width:12px; height:12px; border-radius:50%; display:block; font-style:normal;}

<script>
(function () {
  'use strict';

  /* board: array of 64.  1 = red man, 2 = red king, -1 = black man, -2 = black king */
  var EMPTY = 0;
  var RED = 1, B_RED = -1;
  var r = function (i) { return Math.floor(i / 8); };
  var c = function (i) { return i % 8; };
  var dark = function (i) { return (r(i) + c(i)) % 2 === 1; };

  var G = {
    board: [], turn: 1, bot: null, room: null, isHost: false,
    sel: -1, chain: -1, over: false, busy: false, plyNo: 0
  };

  function newBoard() {
    var b = new Array(64).fill(EMPTY);
    for (var i = 0; i < 64; i++) {
      if (!dark(i)) continue;
      if (r(i) < 3) b[i] = -1;
      else if (r(i) > 4) b[i] = 1;
    }
    return b;
  }

  function side(p) { return p === EMPTY ? 0 : (p > 0 ? 1 : -1); }
  function isKing(p) { return p === 2 || p === -2; }

  /* moves for one piece at index i.  returns [{from,to,jump}] */
  function pieceMoves(b, i, forced) {
    var p = b[i];
    if (!p) return [];
    var s = side(p), out = [];
    var dirs = isKing(p) ? [-1, 1] : (s === 1 ? [-1] : [1]);
    dirs.forEach(function (dr) {
      [-1, 1].forEach(function (dc) {
        var rr = r(i) + dr, cc = c(i) + dc;
        if (rr < 0 || rr > 7 || cc < 0 || cc > 7) return;
        var j = rr * 8 + cc;
        if (b[j] === EMPTY) {
          if (!forced) out.push({ from: i, to: j, jump: null });
          return;
        }
        if (side(b[j]) === s) return;
        var jr = rr + dr, jc = cc + dc;
        if (jr < 0 || jr > 7 || jc < 0 || jc > 7) return;
        var k = jr * 8 + jc;
        if (b[k] !== EMPTY) return;
        out.push({ from: i, to: k, jump: j });
      });
    });
    return out;
  }

  function allMoves(b, s, fromOnly) {
    var jumps = [], steps = [];
    for (var i = 0; i < 64; i++) {
      if (fromOnly != null && i !== fromOnly) continue;
      if (side(b[i]) !== s) continue;
      pieceMoves(b, i, false).forEach(function (m) {
        if (m.jump != null) jumps.push(m); else steps.push(m);
      });
    }
    return jumps.length ? jumps : steps;     /* captures are compulsory */
  }

  function applyMove(b, m) {
    var p = b[m.from];
    b[m.from] = EMPTY;
    if (m.jump != null) b[m.jump] = EMPTY;
    if (p === 1 && r(m.to) === 0) p = 2;
    if (p === -1 && r(m.to) === 7) p = -2;
    b[m.to] = p;
    return p;
  }

  /* ============ bot ============ */
  function clone(b) { return b.slice(); }

  function evaluate(b) {
    var score = 0;
    for (var i = 0; i < 64; i++) {
      var p = b[i];
      if (!p) continue;
      var s = side(p);
      var king = isKing(p) ? 1 : 0;
      var advance = s === 1 ? (7 - r(i)) : r(i);
      var centre = (c(i) > 1 && c(i) < 6) ? 1.5 : 0;
      var back = ((s === 1 && r(i) === 7) || (s === -1 && r(i) === 0)) ? 1.2 : 0;
      score += s * (10 + king * 8 + advance * 0.35 + centre + back);
    }
    return score;                 /* positive is good for red */
  }

  function search(b, s, depth, alpha, beta) {
    var moves = allMoves(b, s);
    if (!moves.length) return s === 1 ? -999 - depth : 999 + depth;
    if (depth === 0) return evaluate(b) * s;
    var best = s === 1 ? -1e9 : 1e9;
    for (var i = 0; i < moves.length; i++) {
      var nb = clone(b);
      applyMove(nb, moves[i]);
      var chain = [];
      if (moves[i].jump != null) {
        var extra = allMoves(nb, s, moves[i].to).filter(function (m) { return m.jump != null; });
        if (extra.length) chain = extra;
      }
      var val;
      if (chain.length) val = search(nb, s, depth - 1, alpha, beta);      /* same side continues */
      else val = search(nb, -s, depth - 1, alpha, beta);
      if (s === 1) { if (val > best) best = val; alpha = Math.max(alpha, best); }
      else { if (val < best) best = val; beta = Math.min(beta, best); }
      if (beta <= alpha) break;
    }
    return best;
  }

  function botMove() {
    var s = G.turn;
    var depth = G.bot === 'hard' ? 5 : (G.bot === 'medium' ? 3 : 2);
    var moves = allMoves(G.board, s);
    if (!moves.length) { gameOver(); return; }
    var best = null, bestVal = s === 1 ? -1e9 : 1e9;
    for (var i = 0; i < moves.length; i++) {
      var nb = clone(G.board);
      applyMove(nb, moves[i]);
      var val = search(nb, -s, depth, -1e9, 1e9);
      if (G.bot === 'easy' && Math.random() < 0.35) val += (Math.random() - 0.5) * 30;
      if (s === 1 ? val > bestVal : val < bestVal) { bestVal = val; best = moves[i]; }
    }
    play(best, true);
  }

  /* ============ play a move ============ */
  function play(m, isBot) {
    if (!m) return;
    G.busy = true;
    applyMove(G.board, m);
    G.sel = -1;

    /* a jump may chain */
    if (m.jump != null && !isBot) {
      var more = allMoves(G.board, G.turn, m.to).filter(function (x) { return x.jump != null; });
      if (more.length) {
        G.chain = m.to;
        render();
        pulse('Another jump is available — keep capturing!');
        G.busy = false;
        return;
      }
    }
    G.chain = -1;
    endTurn();
  }

  function endTurn() {
    G.turn = -G.turn;
    G.busy = false;
    render();
    if (G.room && G.isHost) G.room.send({ t: 'state', s: snapshot() });
    if (!allMoves(G.board, G.turn).length) { gameOver(); return; }
    if (G.bot && G.turn === -1) setTimeout(function () { if (!G.over) botMove(); }, 420);
  }

  function gameOver() {
    G.over = true;
    var msg = 'Draw — no moves left.';
    if (!allMoves(G.board, G.turn).length) msg = G.turn === 1 ? 'Black wins!' : 'Red wins!';
    var cnt = [0, 0];
    G.board.forEach(function (p) { if (p > 0) cnt[0]++; else if (p < 0) cnt[1]++; });
    if (cnt[0] === 0) msg = 'Black wins!';
    if (cnt[1] === 0) msg = 'Red wins!';
    if (G.room) msg = (msg.indexOf('Red') === 0) ? 'You win! 🏆' : (msg.indexOf('Black') === 0 ? 'Friend wins!' : msg);
    document.getElementById('turnBadge').textContent = msg;
    if (window.SAAGAR) window.SAAGAR.toast(msg);
  }

  function snapshot() {
    return { b: G.board, turn: G.turn, over: G.over };
  }
  function applySnapshot(s) {
    G.board = s.b.slice(0, 64);
    G.turn = s.turn; G.over = s.over;
    G.sel = -1; G.chain = -1; G.busy = false;
    render();
  }

  /* ============ render ============ */
  var host = document.getElementById('cboard');

  function render() {
    if (!host.dataset.built) {
      var html = '';
      for (var i = 0; i < 64; i++) html += '<div class="sq" data-i="' + i + '"></div>';
      host.innerHTML = html;
      host.dataset.built = '1';
    }
    var myTurn = !G.over && !G.busy && G.turn === 1 && (G.bot || !G.room || G.isHost);

    for (var i = 0; i < 64; i++) {
      var sq = host.children[i];
      sq.className = 'sq ' + (dark(i) ? 'd' : 'l');
      sq.innerHTML = '';
      var p = G.board[i];
      if (p) {
        var d = document.createElement('div');
        d.className = 'pc ' + (p > 0 ? 'r' : 'b') + (isKing(p) ? ' king' : '');
        if (isKing(p)) {
          /* simple 3-point crown, 24x24 viewBox, per clay spec */
          d.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 L4.8 9.5 L9 13 L12 7 L15 13 L19.2 9.5 L20 17 Z" fill="#facc15" stroke="#b45309" stroke-width="1" stroke-linejoin="round"/></svg>';
        }
        sq.appendChild(d);
      }
    }

    /* highlight */
    if (myTurn || (G.room && G.turn === -1 && !G.isHost)) {
      var moves = G.chain >= 0
        ? allMoves(G.board, G.turn, G.chain)
        : allMoves(G.board, G.turn);
      moves.forEach(function (m) {
        var sq = host.children[m.to];
        sq.classList.add('play');
        sq.classList.add(m.jump != null ? 'cap' : 'hint');
      });
      moves.forEach(function (m) { host.children[m.from].classList.add('play'); });
      if (G.sel >= 0) host.children[G.sel].classList.add('sel');
    }

    var cnt = [0, 0];
    G.board.forEach(function (p) { if (p > 0) cnt[0]++; else if (p < 0) cnt[1]++; });
    document.getElementById('cntRed').textContent = cnt[0];
    document.getElementById('cntBlack').textContent = cnt[1];

    document.getElementById('lblRed').textContent = G.room ? 'Red — You' : 'Red — You';
    document.getElementById('lblBlack').textContent = G.bot ? 'Black — Bot'
      : (G.room ? 'Black — Friend' : 'Black — Player 2');

    if (!G.over) {
      var who = G.turn === 1 ? 'You' : (G.bot ? 'Bot' : (G.room ? 'Friend' : 'Player 2'));
      document.getElementById('turnBadge').textContent = (G.turn === 1 ? '🔴 ' : '⚫ ') + who + ' to move';
    }
  }

  function pulse(msg) {
    var b = document.getElementById('turnBadge');
    b.textContent = msg;
  }

  host.addEventListener('click', function (e) {
    var sq = e.target.closest('.sq');
    if (!sq) return;
    var i = +sq.dataset.i;

    /* my turn? */
    var mine = G.turn === 1 && !G.busy && !G.over && (G.bot || !G.room || G.isHost);
    var guestMine = G.room && !G.isHost && G.turn === -1 && !G.busy && !G.over;
    if (!mine && !guestMine) return;

    var moves = G.chain >= 0 ? allMoves(G.board, G.turn, G.chain) : allMoves(G.board, G.turn);
    var picked = moves.filter(function (m) { return m.from === i; });
    if (picked.length) { G.sel = i; render(); return; }

    var target = moves.filter(function (m) { return m.from === G.sel && m.to === i; });
    if (target.length) {
      if (guestMine) {
        G.room.send({ t: 'move', from: G.sel, to: i });
        G.sel = -1;
        render();
        return;
      }
      play(target[0], false);
      return;
    }
    G.sel = -1;
    render();
  });

  /* ============ start ============ */
  function start(o) {
    G.board = newBoard();
    G.turn = 1; G.sel = -1; G.chain = -1; G.over = false; G.busy = false;
    G.bot = o.bot || null;
    G.room = o.room || null;
    G.isHost = !!o.isHost;
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('stage').classList.remove('hidden');
    document.getElementById('netNote').textContent = G.room ? 'Connected — chat is in the corner 💬' : '';
    render();
  }

  var lobby = window.SAAGAR_LOBBY.create({
    key: 'checkers',
    seatChoices: [2],
    title: '⚪ Checkers',
    root: document.getElementById('lobby'),
    onSolo: function (o) { start({ bot: o.bot }); },
    onHostReady: function (room) { start({ room: room, isHost: true }); },
    onGuestReady: function (room) { start({ room: room, isHost: false }); },
    onMessage: function (msg, room, isHost) {
      if (msg.t === 'move' && isHost) {
        var m = allMoves(G.board, G.turn).filter(function (x) { return x.from === msg.from && x.to === msg.to; })[0];
        if (m) play(m, false);
      }
      if (msg.t === 'state' && !isHost) applySnapshot(msg.s);
    },
    onPeerLeave: function () {
      document.getElementById('netNote').textContent = 'Other player left the room.';
    }
  });

  document.getElementById('again').onclick = function () {
    G.board = newBoard(); G.turn = 1; G.sel = -1; G.chain = -1; G.over = false; G.busy = false;
    render();
    if (G.room && G.isHost) G.room.send({ t: 'state', s: snapshot() });
  };
  document.getElementById('back').onclick = function () {
    document.getElementById('stage').classList.add('hidden');
    document.getElementById('lobby').classList.remove('hidden');
    lobby.menu();
  };
})();
</script>

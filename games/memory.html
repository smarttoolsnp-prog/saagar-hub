<style>
  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:440px; margin:0 auto; perspective:1000px;}
  .cd{aspect-ratio:1; position:relative; transform-style:preserve-3d; transition:transform .42s cubic-bezier(.4,.2,.2,1); cursor:pointer;}
  .cd.flip{transform:rotateY(180deg);}
  .cd .face{position:absolute; inset:0; border-radius:16px; display:grid; place-items:center;
    backface-visibility:hidden; font-size:clamp(26px,7vw,38px);}
  .cd .back{background:linear-gradient(145deg,#fff4e6,#fbe9d2); color:var(--navy-ink); border:none;
    box-shadow:3px 3px 8px rgba(214,138,94,.22), -3px -3px 8px rgba(255,255,255,.9);}
  .cd .front{background:#fff; border:none; transform:rotateY(180deg);
    box-shadow:3px 3px 8px rgba(214,138,94,.25), -3px -3px 8px rgba(255,255,255,.9);}
  .cd.done .front{background:var(--clay-mint); box-shadow:0 0 0 3px #5cc585, var(--sh-clay);}
  .cd.done{animation:pop .35s;}
  @keyframes pop{0%{transform:rotateY(180deg) scale(1);}50%{transform:rotateY(180deg) scale(1.08);}100%{transform:rotateY(180deg) scale(1);}}
  .stats{display:flex; gap:10px; justify-content:center; margin:16px 0; flex-wrap:wrap;}
  .st{background:var(--card); border:none; border-radius:18px; padding:9px 16px; text-align:center; min-width:88px; box-shadow:var(--sh-clay);}
  .st b{display:block; font-size:19px; color:var(--navy-ink);}
  .st span{font-size:10.5px; font-weight:800; letter-spacing:.5px; color:var(--dim); text-transform:uppercase;}
  .racebar{height:14px; border-radius:999px; background:var(--bg-2); border:none; overflow:hidden; margin-top:6px; box-shadow:var(--sh-clay-press);}
  .racebar i{display:block; height:100%; background:linear-gradient(90deg,#a97bff,#7c3aed); transition:width .3s;}
  .result{out{background:var(--clay-mint); color:#256b45; border:transparent; box-shadow:var(--sh-clay-press);}
  .result.appear{transform:scale(1.03);}
</style>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var ICONS = ['🍎','🌙','⭐','🔥','🌊','🍀','🎈','🐚','🍇','🦋','🌻','💎'];
  var PAIRS = 8;

  var cfg = { online: false, isHost: false, room: null, race: false };
  var G = null;

  /* seeded shuffle so both players get the same board */
  function rngFrom(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  function buildDeck(seed) {
    var rnd = rngFrom(seed || (Date.now() & 0xffffffff));
    var icons = ICONS.slice(0, PAIRS);
    var deck = icons.concat(icons);
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function newGame(seed) {
    G = { deck: buildDeck(seed), flipped: [], found: 0, moves: 0, lock: false, t0: null, timer: null, done: false, oppFound: 0 };
    $('result').textContent = '';
    $('result').className = 'out';
    $('stPairs').textContent = '0/' + PAIRS;
    $('stMoves').textContent = '0';
    $('stTime').textContent = '0:00';
    drawBoard();
    if (G.timer) clearInterval(G.timer);
    G.timer = setInterval(tick, 250);
  }

  function tick() {
    if (!G || !G.t0) return;
    var s = Math.floor((Date.now() - G.t0) / 1000);
    $('stTime').textContent = Math.floor(s / 60) + ':' + SAAGAR.pad(s % 60);
  }

  function drawBoard() {
    var b = $('board');
    b.innerHTML = '';
    G.deck.forEach(function (ic, i) {
      var d = document.createElement('div');
      d.className = 'cd';
      d.dataset.i = i;
      d.innerHTML = '<div class="face back">?</div><div class="face front">' + ic + '</div>';
      d.onclick = function () { flip(i); };
      b.appendChild(d);
    });
  }

  function cardEl(i) { return $('board').children[i]; }

  function flip(i) {
    if (!G || G.lock || G.done) return;
    var el = cardEl(i);
    if (!el || el.classList.contains('flip')) return;
    if (!G.t0) G.t0 = Date.now();
    el.classList.add('flip');
    G.flipped.push(i);
    if (G.flipped.length === 2) {
      G.moves++;
      $('stMoves').textContent = G.moves;
      var a = G.flipped[0], b = G.flipped[1];
      if (G.deck[a] === G.deck[b]) {
        G.found++;
        cardEl(a).classList.add('done'); cardEl(b).classList.add('done');
        G.flipped = [];
        $('stPairs').textContent = G.found + '/' + PAIRS;
        if (cfg.online) cfg.room.send({ t: 'progress', found: G.found });
        if (G.found === PAIRS) finish();
      } else {
        G.lock = true;
        setTimeout(function () {
          cardEl(a).classList.remove('flip');
          cardEl(b).classList.remove('flip');
          G.flipped = []; G.lock = false;
        }, 720);
      }
    }
  }

  function finish() {
    G.done = true;
    clearInterval(G.timer);
    var secs = G.t0 ? Math.floor((Date.now() - G.t0) / 1000) : 0;
    var text = '🎉 Cleared in ' + G.moves + ' moves · ' + secs + 's';
    if (cfg.race) text = G.oppFound >= PAIRS ? 'Your friend finished first this time.' : '🏆 You finished first!';
    var key = 'memory.bestmoves';
    var best = SAAGAR.store(key);
    if (!cfg.online && (!best || G.moves < best)) { SAAGAR.store(key, G.moves); text += '  🏆 New best!'; }
    else if (best) text += '  Best: ' + best + ' moves';
    $('result').textContent = text;
    $('result').className = 'out ok';
  }

  /* ---------------- modes ---------------- */
  function showStage(label, note) {
    $('lobby').classList.add('hidden');
    $('stage').classList.remove('hidden');
    $('modeLabel').textContent = label;
    $('netNote').textContent = note || '';
  }

  var lobby = window.SAAGAR_LOBBY.create({
    key: 'memory',
    seatChoices: [2],
    title: '🃏 Choose how to play',
    root: $('lobby'),
    labels: { solo: '▶  Play solo', bot: '🤖  Practise', create: '＋  Create race', join: '🔗  Join race' },
    onSolo: function () {
      cfg = { online: false, isHost: false, room: null, race: false };
      $('stOppWrap').style.display = 'none';
      $('oppRace').style.display = 'none';
      showStage('Solo', 'Fewest moves wins. Best score is saved on this device.');
      newGame();
    },
    onHostReady: function (room) { startRace(room, true); },
    onGuestReady: function (room) { startRace(room, false); },
    onMessage: function (msg, room, isHost) {
      if (msg.t === 'seed' && !isHost) {
        newGame(msg.seed);
        showStage('Race — room ' + room.code, 'Identical board. First to clear all 8 pairs wins!');
      }
      if (msg.t === 'progress') {
        G.oppFound = msg.found;
        $('stOpp').textContent = msg.found + '/' + PAIRS;
        $('oppBar').style.width = (msg.found / PAIRS * 100) + '%';
        if (msg.found >= PAIRS && !G.done) {
          G.done = true; clearInterval(G.timer);
          $('result').textContent = 'Your friend cleared the board first.';
          $('result').className = 'out bad';
        }
      }
      if (msg.t === 'rematch') {
        if (isHost) { var seed = Date.now() & 0xffffffff; room.send({ t: 'seed', seed: seed }); newGame(seed); }
      }
    },
    onPeerLeave: function () {
      $('netNote').textContent = 'Your friend disconnected.';
      SAAGAR.toast('Friend left the race', true);
    }
  });

  function startRace(room, isHost) {
    cfg = { online: true, isHost: isHost, room: room, race: true };
    $('stOppWrap').style.display = '';
    $('oppRace').style.display = '';
    $('stOpp').textContent = '0/' + PAIRS;
    $('oppBar').style.width = '0%';
    if (isHost) {
      var seed = Date.now() & 0xffffffff;
      room.send({ t: 'seed', seed: seed });
      newGame(seed);
      showStage('Race — room ' + room.code, 'Identical board. First to clear all 8 pairs wins!');
    } else {
      showStage('Race — room ' + room.code, 'Building the same board as the host…');
      newGame(0);
    }
  }

  $('again').onclick = function () {
    if (cfg.online) { cfg.room.send({ t: 'rematch' }); if (cfg.isHost) { var s = Date.now() & 0xffffffff; cfg.room.send({ t: 'seed', seed: s }); newGame(s); } }
    else newGame();
  };
  $('back').onclick = function () {
    if (cfg.room) cfg.room.close(true);
    cfg = { online: false, isHost: false, room: null, race: false };
    $('stage').classList.add('hidden');
    $('lobby').classList.remove('hidden');
    lobby.menu();
  };
})();
</script>

<style>
  /* clay spec: butter pill turn indicator, puffy grid cells, X #e11d48 / O #f59e0b, mint win */
  .turn{text-align:center; font-size:16px; font-weight:800; color:var(--navy-ink); margin:6px auto 16px;
    display:table; background:var(--clay-butter); border-radius:999px; padding:9px 22px; box-shadow:var(--sh-clay);}
  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:360px; margin:0 auto;
    background:var(--card); padding:14px; border-radius:26px; box-shadow:var(--sh-clay);}
  .cell{aspect-ratio:1; border-radius:16px; background:var(--bg-2);
    display:grid; place-items:center; font-size:clamp(34px,9vw,50px); font-weight:900; color:var(--navy);
    cursor:pointer; transition:.15s; user-select:none; box-shadow:inset 3px 3px 7px rgba(214,138,94,.14), inset -3px -3px 7px rgba(255,255,255,.85);}
  .cell:hover:not(.taken){background:#fff9f0; transform:translateY(-2px);}
  .cell.taken{cursor:default; background:#fff9f0; box-shadow:var(--sh-clay);}
  .cell.x{color:#e11d48;}
  .cell.o{color:#f59e0b;}
  .cell.win{background:var(--clay-mint); box-shadow:0 0 0 3px rgba(92,197,133,.35), var(--sh-clay);}
  .score{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
  .sc{background:var(--card); border-radius:18px; padding:9px 16px; text-align:center; min-width:92px; box-shadow:var(--sh-clay);}
  .sc b{display:block; font-size:20px; color:var(--navy-ink);}
  .sc span{font-size:11px; font-weight:800; letter-spacing:.6px; color:var(--dim); text-transform:uppercase;}
</style>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), turnEl = $('turn');
  var state = { b: Array(9).fill(''), over: false, wins: [0, 0, 0] };
  var cfg = { bot: null, online: false, isHost: false, myMark: 'X', theirMark: 'O', room: null, busy: false };

  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function winner(b) {
    for (var i = 0; i < LINES.length; i++) {
      var L = LINES[i];
      if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]]) {
        return { mark: b[L[0]], line: L };
      }
    }
    return b.indexOf('') === -1 ? { mark: 'draw', line: [] } : null;
  }

  function other(m) { return m === 'X' ? 'O' : 'X'; }

  /* ---------------- bot ---------------- */
  function emptyCells(b) {
    var r = []; b.forEach(function (v, i) { if (!v) r.push(i); }); return r;
  }
  function minimax(b, me, turn) {
    var w = winner(b);
    if (w) {
      if (w.mark === 'draw') return { score: 0 };
      return { score: w.mark === me ? 10 : -10 };
    }
    var best = { score: turn === me ? -Infinity : Infinity, move: -1 };
    emptyCells(b).forEach(function (i) {
      var nb = b.slice(); nb[i] = turn;
      var res = minimax(nb, me, other(turn));
      // slight depth preference so it wins fast / loses slowly
      var s = res.score + (turn === me ? 0.1 : -0.1) * 0;
      if (turn === me) {
        if (s > best.score) { best.score = s; best.move = i; }
      } else {
        if (s < best.score) { best.score = s; best.move = i; }
      }
    });
    return best;
  }
  function botMove(level) {
    var free = emptyCells(state.b);
    if (!free.length) return -1;
    if (level === 'easy') {
      // 60% random, 40% blocking/winning if obvious
      var obvious = findImmediate(state.b, 'O') ;
      if (obvious > -1 && Math.random() < 0.4) return obvious;
      return free[Math.floor(Math.random() * free.length)];
    }
    if (level === 'medium') {
      if (Math.random() < 0.25) return free[Math.floor(Math.random() * free.length)];
      var w = findImmediate(state.b, 'O');
      if (w > -1) return w;
      var blk = findImmediate(state.b, 'X');
      if (blk > -1) return blk;
      if (state.b[4] === '') return 4;
      return free[Math.floor(Math.random() * free.length)];
    }
    return minimax(state.b, 'O', 'O').move;
  }
  function findImmediate(b, mark) {
    for (var i = 0; i < LINES.length; i++) {
      var L = LINES[i], c = 0, e = -1;
      for (var j = 0; j < 3; j++) {
        if (b[L[j]] === mark) c++;
        else if (b[L[j]] === '') e = L[j];
      }
      if (c === 2 && e > -1) return e;
    }
    return -1;
  }

  /* ---------------- render ---------------- */
  function draw(wline) {
    board.innerHTML = '';
    state.b.forEach(function (v, i) {
      var d = document.createElement('div');
      d.className = 'cell' + (v ? ' taken ' + v.toLowerCase() : '') + (wline && wline.indexOf(i) > -1 ? ' win' : '');
      d.textContent = v;
      d.onclick = function () { play(i); };
      board.appendChild(d);
    });
    $('scYou').textContent = state.wins[0];
    $('scDraw').textContent = state.wins[2];
    $('scThem').textContent = state.wins[1];
  }

  function setTurn(text) { turnEl.textContent = text; }

  /* ---------------- core ---------------- */
  function play(i, fromNetwork) {
    if (state.over || state.b[i]) return;
    var mark = cfg.online ? cfg.myMark : 'X';
    if (!fromNetwork && cfg.online && !cfg.isHost) {
      // guest: send move to host, optimistically show
      if (!isMyTurn()) return;
      cfg.room.send({ t: 'move', i: i });
      applyMove(i, cfg.myMark);
      return;
    }
    if (!fromNetwork && !isMyTurn()) return;
    applyMove(i, mark);
    if (cfg.online && cfg.isHost) {
      cfg.room.send({ t: 'state', b: state.b, over: state.over, res: state.res || null });
    }
  }

  function isMyTurn() {
    if (state.over) return false;
    if (cfg.online) {    var turnMark = state.b.filter(Boolean).length % 2 === 0 ? 'O' : 'X';
          return turnMark === cfg.myMark;
    }
    return state.b.filter(Boolean).length % 2 === 0; /* human is X */
  }

  function applyMove(i, mark) {
    state.b[i] = mark;
    var w = winner(state.b);
    if (w) {
      state.over = true;
      state.res = w;
      if (w.mark === 'draw') { state.wins[2]++; setTurn('Draw — nobody wins.'); }
      else {
        var iWon = cfg.online ? (w.mark === cfg.myMark) : (w.mark === 'X');
        state.wins[iWon ? 0 : 1]++;
        setTurn(w.mark === 'X' ? 'X wins!' : 'O wins!');
      }
      draw(w.line);
      return;
    }
    draw();
    setTurn(isMyTurn() ? 'Your turn' : (cfg.online ? "Friend's turn" : 'Bot thinking…'));
    if (cfg.bot && !state.over) {
      setTimeout(function () {
        var mv = botMove(cfg.bot);
        if (mv > -1) {
          state.b[mv] = 'O';
          var w2 = winner(state.b);
          if (w2) {
            state.over = true;
            if (w2.mark === 'draw') { state.wins[2]++; setTurn('Draw — nobody wins.'); }
            else { state.wins[1]++; setTurn('Bot wins!'); }
            draw(w2.line);
          } else { draw(); setTurn('Your turn'); }
        }
      }, 380);
    }
  }

  function reset() {
    state.b = Array(9).fill(''); state.over = false; state.res = null;
    draw();
    setTurn(isMyTurn() ? 'Your turn' : (cfg.online ? "Friend's turn" : 'Bot thinking…'));
  }

  /* ---------------- start modes ---------------- */
  function showStage(label, note) {
    $('lobby').classList.add('hidden');
    $('stage').classList.remove('hidden');
    $('modeLabel').textContent = label;
    $('netNote').textContent = note || '';
    var tttMode = document.getElementById('tttMode');
    if (tttMode) tttMode.innerHTML = '<span class="em">🎯</span> <span id="tttModeLabel">' + label + '</span>';
  }

  function startSolo(opts) {
    cfg = { bot: opts.bot, online: false, isHost: false, myMark: 'X', theirMark: 'O', room: null };
    state.wins = [0, 0, 0];
    $('lblYou').textContent = 'You (X)';
    $('lblThem').textContent = opts.bot ? ('Bot (' + opts.bot + ')') : '—';
    showStage(opts.bot ? 'You vs Bot' : 'Solo practice');
    var tttModeLabel = document.getElementById('tttModeLabel');
    if (tttModeLabel) tttModeLabel.textContent = opts.bot ? 'You vs Bot' : 'Solo practice';
    reset();
  }

  function startRoom(room, isHost) {
    cfg.bot = null;
    cfg.online = true;
    cfg.isHost = isHost;
    cfg.room = room;
    cfg.myMark = isHost ? 'X' : 'O';
    cfg.theirMark = isHost ? 'O' : 'X';
    state.wins = [0, 0, 0];
    $('lblYou').textContent = 'You (' + cfg.myMark + ')';
    $('lblThem').textContent = 'Friend (' + cfg.theirMark + ')';
    showStage(isHost ? 'Room ' + room.code + ' — you are X' : 'Room ' + room.code + ' — you are O',
              'Connected. ' + (isHost ? 'You move first.' : 'Waiting for the host to move.'));
    var tttModeLabel = document.getElementById('tttModeLabel');
    if (tttModeLabel) tttModeLabel.textContent = isHost ? 'Room ' + room.code + ' — you are X' : 'Room ' + room.code + ' — you are O';
    reset();
    if (isHost) room.send({ t: 'state', b: state.b, over: false, res: null });
  }

  /* ---------------- lobby ---------------- */
  var lobby = window.SAAGAR_LOBBY.create({
    key: 'ttt',
    seatChoices: [2],
    title: '🎯 Choose how to play Tic-Tac-Toe',
    root: $('lobby'),
    onSolo: startSolo,
    onHostReady: function (room) { startRoom(room, true); },
    onGuestReady: function (room) { startRoom(room, false); },
    onMessage: function (msg, room, isHost) {
      if (msg.t === 'move' && isHost) {
        if (!state.b[msg.i] && !state.over) {
          state.b[msg.i] = cfg.theirMark;
          var w = winner(state.b);
          if (w) {
            state.over = true; state.res = w;
            if (w.mark === 'draw') { state.wins[2]++; setTurn('Draw — nobody wins.'); }
            else { state.wins[0]++; setTurn('You win!'); }
            draw(w.line);
          } else {
            draw(); setTurn('Your turn');
          }
          room.send({ t: 'state', b: state.b, over: state.over, res: state.res || null });
        }
      }
      if (msg.t === 'state' && !isHost) {
        state.b = msg.b; state.over = !!msg.over; state.res = msg.res;
        if (state.over && msg.res) {
          if (msg.res.mark === 'draw') { state.wins[2]++; setTurn('Draw — nobody wins.'); }
          else if (msg.res.mark === cfg.myMark) { state.wins[0]++; setTurn('You win!'); }
          else { state.wins[1]++; setTurn('Friend wins.'); }
          draw(msg.res.line);
        } else {
          draw();
          var turnMark = state.b.filter(Boolean).length % 2 === 0 ? 'X' : 'O';
          setTurn(turnMark === cfg.myMark ? 'Your turn' : "Friend's turn");
        }
      }
      if (msg.t === 'again' && !isHost) { cfg.room.send({ t: 'again-ok' }); reset(); }
      if (msg.t === 'again-ok' && isHost) { reset(); }
      if (msg.t === 'again') { }
    },
    onPeerLeave: function (room, isHost) {
      $('netNote').textContent = 'Your friend disconnected.';
      window.SAAGAR.toast('Friend left the game', true);
    }
  });

  $('again').onclick = function () {
    if (cfg.online) { cfg.room.send({ t: 'again' }); if (cfg.isHost) reset(); }
    else reset();
  };
  $('back').onclick = function () {
    if (cfg.room) { cfg.room.close(true); }
    cfg = { bot: null, online: false, isHost: false, myMark: 'X', theirMark: 'O', room: null };
    $('stage').classList.add('hidden');
    $('lobby').classList.remove('hidden');
    localStorage.removeItem('ttt.turn');
    lobby.menu();
  };
})();
</script>

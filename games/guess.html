  .triesfield{display:flex; flex-direction:column; gap:10px; margin-top:6px;}

  .clay-action:focus{outline:none; opacity:.9;}
  .histrow{display:flex; gap:14px; justify-content:center; margin-top:12px; flex-wrap:wrap; font-size:13px; color:var(--dim); font-weight:700;}
  .histrow b{color:var(--navy-ink);}
  .triesfield .field input{max-height:38px; border-radius:999px; background:var(--card); box-shadow:var(--sh-clay-press);
    color:var(--navy-ink); text-align:center; padding:0 12px; line-height:38px;
  }
  .triesfield .field input::placeholder{color:#c5a489;}
  .clay-action{height:38px; padding:0 18px; border-radius:999px; background:linear-gradient(135deg,#ffd66b,#ff9a7a);
    color:#6b4423; box-shadow:4px 4px 10px rgba(214,138,94,.32), -4px -4px 10px rgba(255,255,255,.95); font-weight:900; letter-spacing:.03em;}
  .clay-action:active{box-shadow:var(--sh-clay-press); transform:scale(.96);}
  .clay-action:focus{outline:none; opacity:.9;}
  .triesfield .field input{max-height:38px; border-radius:999px; padding:0 12px; vertical-align:middle;}
  .clay-action{height:38px; padding:0 16px;}

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var MAX = 100;
  var cfg = { bot: null, online: false, isHost: false, room: null };
  var G = null;

  function newGame(secret) {
    G = { secret: secret || (1 + Math.floor(Math.random() * MAX)), tries: [], done: false, mySecret: null, oppDone: false };
    $('tries').innerHTML = '';
    $('hist').innerHTML = '';
    document.querySelectorAll('.mark').forEach(function (m) { m.remove(); });
    $('hint').textContent = cfg.online ? 'Guess your friend\'s number' : 'Type a number and guess';
    $('gIn').value = '';
    $('gIn').disabled = false;
    $('gGo').disabled = false;
    $('gIn').focus();
  }

  function addMark(v, cls) {
    var m = document.createElement('div');
    m.className = 'mark ' + cls;
    m.style.left = ((v - 1) / (MAX - 1) * 100) + '%';
    $('scale').appendChild(m);
  }

  function showTries() {
    var w = $('tries'); w.innerHTML = '';
    G.tries.forEach(function (t) {
      var s = document.createElement('span');
      s.textContent = t.v + ' ' + (t.r === 'low' ? '↑' : t.r === 'high' ? '↓' : '✓');
      w.appendChild(s);
    });
    if (cfg.bot) {
      $('hist').innerHTML = '<span>Bot par: <b>7</b> tries</span><span>Your tries: <b>' + G.tries.length + '</b></span>';
    }
  }

  /* ------------------- solo / bot ------------------- */
  function guessLocal(v) {
    if (G.done) return;
    if (!(v >= 1 && v <= MAX) || Math.floor(v) !== v) { SAAGAR.toast('Enter a whole number from 1 to 100', true); return; }
    G.tries.push({ v: v });
    var diff = Math.abs(v - G.secret);
    var res, cls, text;
    if (v === G.secret) {
      addMark(v, 'm-win');
      G.done = true;
      res = 'win';
      text = '🎉 Found it in ' + G.tries.length + ' tries!';
      if (cfg.bot) {
        text += G.tries.length < 7 ? '  You beat the bot\'s 7.' : G.tries.length === 7 ? '  Same as the bot.' : '  The bot needs just 7.';
      }
      var best = SAAGAR.store('guess.best');
      if (!best || G.tries.length < best) { SAAGAR.store('guess.best', G.tries.length); text += '  🏆 New best!'; }
      $('gIn').disabled = true; $('gGo').disabled = true;
    } else if (v < G.secret) {
      res = 'low'; cls = 'm-low';
      text = diff <= 3 ? '🔥 Very close — go higher' : diff <= 10 ? 'Warmer — try higher' : diff <= 25 ? 'Cold — go higher' : '🧊 Freezing — much higher';
      addMark(v, cls);
    } else {
      res = 'high'; cls = 'm-high';
      text = diff <= 3 ? '🔥 Very close — go lower' : diff <= 10 ? 'Warmer — try lower' : diff <= 25 ? 'Cold — go lower' : '🧊 Freezing — go much lower';
      addMark(v, cls);
    }
    G.tries[G.tries.length - 1].r = res;
    showTries();
    $('hint').textContent = text;
    $('gIn').value = '';
    if (!G.done) $('gIn').focus();
  }

  /* ------------------- online duel ------------------- */
  /* Each player picks a secret for the opponent. Turns alternate.
     Host keeps the scoreboard; both sides see both hint streams. */
  function startOnlineRoom(room, isHost) {
    cfg = { bot: null, online: true, isHost: isHost, room: room };
    $('modeLabel').textContent = 'Room ' + room.code;
    $('stage').classList.remove('hidden');
    $('lobby').classList.add('hidden');
    $('netNote').textContent = 'Pick a secret number for your friend to guess.';

    /* ask for the secret first (prompt can be blocked in some browsers — fall back to random) */
    var n;
    try {
      var secret = prompt('Choose a secret number (1–100) for your friend to guess:', String(20 + Math.floor(Math.random() * 60)));
      n = parseInt(secret, 10);
    } catch (e) { n = NaN; }
    if (!(n >= 1 && n <= MAX)) n = 1 + Math.floor(Math.random() * MAX);
    G = { secret: null, tries: [], done: false, mySecret: n };
    document.querySelectorAll('.mark').forEach(function (m) { m.remove(); });
    $('tries').innerHTML = '';
    $('hint').textContent = isHost ? 'You guess first' : 'Waiting for the host to guess…';
    $('gIn').value = '';
    room.send({ t: 'secret', s: n });
    G.myTurn = isHost;
    $('gIn').disabled = !isHost;
    $('gGo').disabled = !isHost;
  }

  /* ------------------- UI ------------------- */
  function showStage(label, note) {
    $('lobby').classList.add('hidden');
    $('stage').classList.remove('hidden');
    $('modeLabel').textContent = label;
    $('netNote').textContent = note || '';
  }

  var lobby = window.SAAGAR_LOBBY.create({
    key: 'guess',
    seatChoices: [2],
    title: '🔢 Choose how to play',
    root: $('lobby'),
    onSolo: function (o) {
      cfg = { bot: o.bot || 'medium', online: false, isHost: false, room: null };
      showStage(o.bot ? 'Beat the bot' : 'Solo practice',
        o.bot ? 'The bot solves it in 7 tries. Use halving to beat that.' : 'Fewest tries wins. Best: ' + (SAAGAR.store('guess.best') || '—'));
      newGame();
    },
    onHostReady: function (room) { startOnlineRoom(room, true); },
    onGuestReady: function (room) { startOnlineRoom(room, false); },
    onMessage: function (msg, room, isHost) {
      if (msg.t === 'secret') {
        G.secret = msg.s;
        G.tries = []; G.done = false; G.myTurn = !!isHost;   /* host always guesses first */
        document.querySelectorAll('.mark').forEach(function (m) { m.remove(); });
        showTries();
        $('hint').textContent = isHost ? 'New secret set — you guess first' : 'New secret set — waiting for the host…';
        $('gIn').disabled = !isHost; $('gGo').disabled = !isHost;
        return;
      }
      if (msg.t === 'guess') {
        /* someone guessed MY number */
        var v = msg.v;
        var diff = Math.abs(v - G.mySecret);
        var res = v === G.mySecret ? 'win' : (v < G.mySecret ? 'low' : 'high');
        room.send({ t: 'result', res: res, v: v, by: msg.by });
        if (res === 'win') {
          G.oppDone = true;
          $('netNote').textContent = 'Your friend found your number in ' + (msg.count || '?') + ' tries.';
        } else {
          $('netNote').textContent = 'Your friend guessed ' + v + ' — ' + (res === 'low' ? 'too low' : 'too high') + ' for your number.';
        }
        /* alternation: the judge guesses next (unless already done) */
        if (!G.done) {
          G.myTurn = true;
          $('gIn').disabled = false; $('gGo').disabled = false; $('gIn').focus();
        }
        return;
      }
      if (msg.t === 'result') {
        /* result of MY guess */
        addMark(msg.v, msg.res === 'win' ? 'm-win' : msg.res === 'low' ? 'm-low' : 'm-high');
        G.tries.push({ v: msg.v, r: msg.res });
        showTries();
        if (msg.res === 'win') {
          G.done = true;
          $('hint').textContent = '🎉 You found it in ' + G.tries.length + ' tries!';
          $('gIn').disabled = true; $('gGo').disabled = true;
          if (G.oppDone) $('netNote').textContent = 'Both numbers found — press Play again for a rematch.';
        } else {
          $('hint').textContent = (msg.res === 'low' ? 'Too low — go higher' : 'Too high — go lower') + '  (' + G.tries.length + ' tries) — waiting for your friend…';
        }
      }
      if (msg.t === 'restart') { startOnlineRoom(cfg.room, cfg.isHost); return; }
    },
    onPeerLeave: function () {
      $('netNote').textContent = 'Your friend disconnected.';
      SAAGAR.toast('Friend left the game', true);
    }
  });

  /* guard the online start (needs the secret handshake) */
  var origHost = lobby;

  function submit() {
    var v = parseInt($('gIn').value, 10);
    if (cfg.online) {
      if (!G.myTurn || G.done) return;
      if (!(v >= 1 && v <= MAX)) { SAAGAR.toast('Enter 1–100', true); return; }
      G.myTurn = false;
      $('gIn').disabled = true; $('gGo').disabled = true;
      $('hint').textContent = 'Waiting for your friend…';
      /* guess the opponent's number: ask the opponent to judge */
      cfg.room.send({ t: 'guess', v: v, count: G.tries.length + 1, by: 'me' });
      return;
    }
    guessLocal(v);
  }

  $('gGo').onclick = submit;
  $('gIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

  $('again').onclick = function () {
    if (cfg.online) { rematch(); return; }
    newGame();
  };

  /* both sides re-pick a fresh secret and the duel restarts cleanly */
  function rematch() {
    cfg.room.send({ t: 'restart' });
    startOnlineRoom(cfg.room, cfg.isHost);
  }
  $('back').onclick = function () {
    if (cfg.room) cfg.room.close(true);
    cfg = { bot: null, online: false, isHost: false, room: null };
    $('stage').classList.add('hidden');
    $('lobby').classList.remove('hidden');
    lobby.menu();
  };
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio-data Builder — fill once, print clean | SAAGAR Tools</title>
<meta name="description" content="Build a clean bio-data or CV: fill the form, see it live, then print or save it as a PDF.">
<meta name="theme-color" content="#171341">
<link rel="icon" href="../assets/saagar-logo.png" type="image/png">
<link rel="canonical" href="https://sagardahal123.com.np/tools/biodata.html">
<link rel="stylesheet" href="../assets/site.css">
<style>
  .split{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
  @media(max-width:900px){ .split{grid-template-columns:1fr;} }
  .sheet{background:#fff; border:1px solid var(--line); border-radius:12px; padding:26px 24px; box-shadow:var(--sh); font-size:13.5px;}
  .sheet h2{font-size:21px; margin:0; color:var(--navy-2); letter-spacing:.4px;}
  .sheet .role{color:var(--dim); font-weight:700; font-size:13px; margin-top:2px;}
  .sheet .head{display:flex; gap:16px; align-items:flex-start; border-bottom:2.5px solid var(--navy); padding-bottom:14px; margin-bottom:14px;}
  .sheet .head img{width:96px; height:118px; object-fit:cover; border:1px solid var(--line-2); border-radius:6px; background:#f5f8fb;}
  .sheet h3{font-size:12px; letter-spacing:1.8px; text-transform:uppercase; color:var(--navy); margin:16px 0 7px; border-bottom:1px solid var(--line); padding-bottom:4px;}
  .kv{display:grid; grid-template-columns:150px 1fr; gap:3px 12px; font-size:13.5px;}
  .kv dt{font-weight:800; color:var(--dim);}
  .sheet ul{padding-left:19px;}
  .eduRow{display:grid; grid-template-columns:1.4fr 1fr .8fr auto; gap:8px; margin-bottom:8px;}
  @media(max-width:640px){ .eduRow{grid-template-columns:1fr 1fr;} .eduRow .rm{grid-column:span 2;} }
  .rm{background:#fdf0f0; border:1.5px solid #f3c4c4; color:#a11f1f; border-radius:9px; width:36px; height:36px; font-weight:900;}
  @media print{
    body{background:#fff;}
    #hdr,#ftr,.phero,.noprint{display:none !important;}
    .wrap{max-width:none; padding:0;}
    .split{grid-template-columns:1fr;}
    .sheet{border:0; box-shadow:none; padding:0; border-radius:0; font-size:12.5pt;}
    .sec{padding:0;}
    .card{display:none;}
  }
</style>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9617852445804852"
     crossorigin="anonymous"></script>
</head>
<body data-root=".." data-page="tools">

<div id="hdr"></div>

<section class="phero">
  <div class="wrap">
    <div class="crumb"><a href="../index.html">Home</a> / <a href="../tools.html">Smart Tools</a> / Bio-data Builder</div>
    <h1><span class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;display:inline;vertical-align:top;margin-right:6px"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16 C7 14 11 14 12 16 M14 9 L18 9 M14 13 L18 13"/></svg></span>Bio-data Builder</h1>
    </div>
</section>

<main class="sec">
  <div class="wrap">
    <div class="split">
      <div class="card noprint">
        <h2><span class="em">✏️</span> Your details</h2>
        <div class="grid2">
          <div class="field"><label for="name">Full name</label><input type="text" id="name" placeholder="Sagar Dahal"></div>
          <div class="field"><label for="role">Position / objective</label><input type="text" id="role" placeholder="Junior Accountant"></div>
          <div class="field"><label for="father">Father's name</label><input type="text" id="father"></div>
          <div class="field"><label for="mother">Mother's name</label><input type="text" id="mother"></div>
          <div class="field"><label for="dobAd">Date of birth (AD)</label><input type="date" id="dobAd"></div>
          <div class="field"><label for="dobBs">Date of birth (BS)</label><input type="text" id="dobBs" placeholder="2055-02-14"></div>
          <div class="field"><label for="gender">Gender</label><input type="text" id="gender" placeholder="Male / Female"></div>
          <div class="field"><label for="marital">Marital status</label><input type="text" id="marital" placeholder="Unmarried"></div>
          <div class="field"><label for="nationality">Nationality</label><input type="text" id="nationality" value="Nepali"></div>
          <div class="field"><label for="religion">Religion</label><input type="text" id="religion"></div>
          <div class="field"><label for="phone">Phone</label><input type="text" id="phone"></div>
          <div class="field"><label for="email">Email</label><input type="text" id="email"></div>
          <div class="field" style="grid-column:1/-1;"><label for="address">Address</label><input type="text" id="address"></div>
        </div>

        <h2 class="mt-l"><span class="em">🎓</span> Education</h2>
        <div id="edu"></div>
        <button class="btn soft sm" id="addEdu" type="button">＋ Add qualification</button>

        <h2 class="mt-l"><span class="em">💼</span> Experience</h2>
        <textarea id="exp" rows="3" placeholder="One per line: Job title — Organisation — Years"></textarea>

        <div class="grid2 mt">
          <div class="field"><label for="skills">Skills (comma separated)</label><textarea id="skills" rows="2" placeholder="Excel, Tally, Typing"></textarea></div>
          <div class="field"><label for="langs">Languages</label><textarea id="langs" rows="2" placeholder="Nepali, English, Hindi"></textarea></div>
          <div class="field"><label for="hobbies">Hobbies</label><textarea id="hobbies" rows="2" placeholder="Reading, Football"></textarea></div>
          <div class="field"><label for="photo">Photo (optional)</label><input type="file" id="photo" accept="image/*" style="padding:7px;"></div>
        </div>

        <div class="row mt">
          <button class="btn" id="print" type="button" style="flex:0 0 auto;">🖨 Print / Save as PDF</button>
          <button class="btn ghost" id="reset" type="button" style="flex:0 0 auto;">Clear form</button>
        </div>
        <div class="out" id="msg" role="status"></div>
      </div>

      <div class="sheet" id="sheet">
        <div class="head">
          <img id="photoPrev" alt="" style="display:none;">
          <div>
            <h2 id="pName">Your Name</h2>
            <div class="role" id="pRole">Bio-data</div>
          </div>
        </div>
        <h3>Personal details</h3>
        <dl class="kv" id="pPersonal"></dl>
        <div id="pEduWrap"><h3>Education</h3><div id="pEdu"></div></div>
        <div id="pExpWrap"><h3>Experience</h3><ul id="pExp"></ul></div>
        <div id="pSkillsWrap"><h3>Skills &amp; languages</h3><div id="pSkills"></div></div>
        <div id="pHobbyWrap"><h3>Interests</h3><div id="pHobby"></div></div>
        <p class="muted" style="margin-top:18px; font-size:11.5px;">I declare that the information above is true to the best of my knowledge.</p>
      </div>
    </div>
  </div>
</main>

<div id="ftr"></div>

<script src="../assets/app.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function addEdu(v, inst, year) {
    var d = document.createElement('div');
    d.className = 'eduRow';
    d.innerHTML =
      '<input type="text" placeholder="Degree / level" value="' + esc(v) + '">' +
      '<input type="text" placeholder="Institution" value="' + esc(inst) + '">' +
      '<input type="text" placeholder="Year / result" value="' + esc(year) + '">' +
      '<button class="rm" type="button">×</button>';
    d.querySelector('.rm').onclick = function () { d.remove(); render(); };
    d.querySelectorAll('input').forEach(function (i) { i.addEventListener('input', render); });
    $('edu').appendChild(d);
  }

  function render() {
    var name = $('name').value.trim() || 'Your Name';
    $('pName').textContent = name;
    $('pRole').textContent = $('role').value.trim() || 'Bio-data';

    var rows = [
      ['Father\'s name', $('father').value],
      ['Mother\'s name', $('mother').value],
      ['Date of birth (AD)', $('dobAd').value],
      ['Date of birth (BS)', $('dobBs').value],
      ['Gender', $('gender').value],
      ['Marital status', $('marital').value],
      ['Nationality', $('nationality').value],
      ['Religion', $('religion').value],
      ['Phone', $('phone').value],
      ['Email', $('email').value],
      ['Address', $('address').value]
    ].filter(function (r) { return r[1] && String(r[1]).trim(); });

    $('pPersonal').innerHTML = rows.map(function (r) {
      return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>';
    }).join('');

    /* education */
    var edu = [];
    $('edu').querySelectorAll('.eduRow').forEach(function (r) {
      var ins = r.querySelectorAll('input');
      if (ins[0].value.trim() || ins[1].value.trim()) {
        edu.push('<li>' + esc(ins[0].value) + (ins[1].value ? ' — ' + esc(ins[1].value) : '') + (ins[2].value ? ' (' + esc(ins[2].value) + ')' : '') + '</li>');
      }
    });
    $('pEdu').innerHTML = edu.join('');
    $('pEduWrap').style.display = edu.length ? '' : 'none';

    /* experience */
    var exp = $('exp').value.split('\n').filter(function (l) { return l.trim(); });
    $('pExp').innerHTML = exp.map(function (l) { return '<li>' + esc(l.trim()) + '</li>'; }).join('');
    $('pExpWrap').style.display = exp.length ? '' : 'none';

    /* skills */
    var sk = $('skills').value.trim();
    var lg = $('langs').value.trim();
    var out = [];
    if (sk) out.push('<b>Skills:</b> ' + esc(sk));
    if (lg) out.push('<b>Languages:</b> ' + esc(lg));
    $('pSkills').innerHTML = out.join('<br>');
    $('pSkillsWrap').style.display = out.length ? '' : 'none';

    var hb = $('hobbies').value.trim();
    $('pHobby').textContent = hb;
    $('pHobbyWrap').style.display = hb ? '' : 'none';

    /* keep new education rows wired */
    Array.prototype.forEach.call($('edu').querySelectorAll('.eduRow input'), function (i) {
      if (!i.dataset.wired) { i.dataset.wired = '1'; i.addEventListener('input', render); }
    });
  }

  ['name','role','father','mother','dobAd','dobBs','gender','marital','nationality','religion','phone','email','address','exp','skills','langs','hobbies']
    .forEach(function (id) { $(id).addEventListener('input', render); });

  $('addEdu').onclick = function () { addEdu('', '', ''); };

  $('photo').onchange = function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      $('photoPrev').src = r.result;
      $('photoPrev').style.display = '';
    };
    r.readAsDataURL(f);
  };

  $('print').onclick = function () {
    if (!$('name').value.trim()) {
      $('msg').textContent = 'Add at least your name before printing.';
      $('msg').className = 'out bad';
      return;
    }
    $('msg').textContent = '';
    window.print();
  };

  $('reset').onclick = function () {
    if (!confirm('Clear everything in the form?')) return;
    ['name','role','father','mother','dobAd','dobBs','gender','marital','religion','phone','email','address','exp','skills','langs','hobbies']
      .forEach(function (id) { $(id).value = ''; });
    $('nationality').value = 'Nepali';
    $('edu').innerHTML = '';
    addEdu('', '', '');
    $('photoPrev').style.display = 'none';
    render();
  };

  addEdu('', '', '');
  render();
})();
</script>
</body>
</html>

<main class="sec">
  <div class="wrap">
    <div class="split">
      <div class="card noprint">
        <h2><span class="em">✏️</span> Details</h2>
        <div class="grid2">
          <div class="field"><label for="name">Full name</label><input type="text" id="name" placeholder="Sagar Dahal"></div>
          <div class="field"><label for="dobBs">Date of birth (BS)</label><input type="text" id="dobBs" placeholder="2055-02-14"></div>
          <div class="field"><label for="dobAd">Date of birth (AD)</label><input type="date" id="dobAd"></div>
          <div class="field"><label for="birthPlace">Birth place</label><input type="text" id="birthPlace" placeholder="Sankhuwasabha"></div>
          <div class="field"><label for="height">Height</label><input type="text" id="height" placeholder="5 ft 8 in"></div>
          <div class="field"><label for="blood">Blood group</label><input type="text" id="blood" placeholder="O+"></div>
          <div class="field"><label for="caste">Caste / ethnicity</label><input type="text" id="caste"></div>
          <div class="field"><label for="gotra">Gotra / clan (if applicable)</label><input type="text" id="gotra"></div>
          <div class="field"><label for="religion">Religion</label><input type="text" id="religion" value="Hindu"></div>
          <div class="field"><label for="motherTongue">Mother tongue</label><input type="text" id="motherTongue" value="Nepali"></div>
          <div class="field"><label for="job">Occupation</label><input type="text" id="job"></div>
          <div class="field"><label for="income">Monthly income</label><input type="text" id="income"></div>
          <div class="field"><label for="father">Father's name</label><input type="text" id="father"></div>
          <div class="field"><label for="fatherJob">Father's occupation</label><input type="text" id="fatherJob"></div>
          <div class="field"><label for="mother">Mother's name</label><input type="text" id="mother"></div>
          <div class="field"><label for="motherJob">Mother's occupation</label><input type="text" id="motherJob"></div>
          <div class="field" style="grid-column:1/-1;"><label for="siblings">Brothers / sisters</label><input type="text" id="siblings" placeholder="2 brothers, 1 sister"></div>
          <div class="field" style="grid-column:1/-1;"><label for="permAddress">Permanent address</label><input type="text" id="permAddress"></div>
          <div class="field" style="grid-column:1/-1;"><label for="curAddress">Current address</label><input type="text" id="curAddress"></div>
          <div class="field"><label for="phone">Contact number</label><input type="text" id="phone"></div>
          <div class="field"><label for="email">Email</label><input type="text" id="email"></div>
        </div>

        <h2 class="mt-l"><span class="em">🎓</span> Education &amp; work</h2>
        <div class="field"><label for="edu">Qualifications (one per line)</label><textarea id="edu" rows="3" placeholder="SLC — 2072, Shree Secondary School&#10;BBS — 2078, Tribhuvan University"></textarea></div>
        <div class="field mt"><label for="about">About me / expectations</label><textarea id="about" rows="3" placeholder="A few honest lines about yourself and what you are looking for."></textarea></div>
        <div class="field mt"><label for="photo">Photo (optional)</label><input type="file" id="photo" accept="image/*" style="padding:7px;"></div>

        <div class="row mt">
          <button class="btn" id="print" type="button" style="flex:0 0 auto;">🖨 Print / Save as PDF</button>
          <button class="btn ghost" id="reset" type="button" style="flex:0 0 auto;">Clear</button>

        <dl class="kv" id="pFamily"></dl>
        <div id="pEduWrap"><h3>Education &amp; occupation</h3><ul id="pEdu"></ul></div>
        <div id="pAboutWrap"><h3>About</h3><p id="pAbout"></p></div>
        <h3>Contact</h3>

      </div>

<script src="../assets/app.js?v=bc306dd9"></script>
<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function pairs(list) {
    return list.filter(function (r) { return r[1] && String(r[1]).trim(); })
      .map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('');
  }

  function render() {
    $('pName').textContent = $('name').value.trim() || 'Full Name';
    $('pPersonal').innerHTML = pairs([
      ['Date of birth (BS)', $('dobBs').value],
      ['Date of birth (AD)', $('dobAd').value],
      ['Birth place', $('birthPlace').value],
      ['Height', $('height').value],
      ['Blood group', $('blood').value],
      ['Caste / ethnicity', $('caste').value],
      ['Gotra / clan', $('gotra').value],
      ['Religion', $('religion').value],
      ['Mother tongue', $('motherTongue').value]
    ]);
    $('pFamily').innerHTML = pairs([
      ['Father', $('father').value],
      ['Father\'s occupation', $('fatherJob').value],
      ['Mother', $('mother').value],
      ['Mother\'s occupation', $('motherJob').value],
      ['Brothers / sisters', $('siblings').value]
    ]);
    var edu = $('edu').value.split('\n').filter(function (l) { return l.trim(); });
    var occ = [$('job').value, $('income').value ? 'Income: ' + $('income').value : ''].filter(function (x) { return x && x.trim(); });
    var eduHtml = edu.map(function (l) { return '<li>' + esc(l.trim()) + '</li>'; }).join('');
    if (occ.length) eduHtml = occ.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + eduHtml;
    $('pEdu').innerHTML = eduHtml;
    $('pEduWrap').style.display = eduHtml ? '' : 'none';

    var about = $('about').value.trim();
    $('pAbout').textContent = about;
    $('pAboutWrap').style.display = about ? '' : 'none';

    $('pContact').innerHTML = pairs([
      ['Permanent address', $('permAddress').value],
      ['Current address', $('curAddress').value],
      ['Phone', $('phone').value],
      ['Email', $('email').value]
    ]);
  }

  ['name','dobBs','dobAd','birthPlace','height','blood','caste','gotra','religion','motherTongue',
   'job','income','father','fatherJob','mother','motherJob','siblings','permAddress','curAddress',
   'phone','email','edu','about'].forEach(function (id) { $(id).addEventListener('input', render); });

  $('photo').onchange = function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { $('photoPrev').src = r.result; $('photoPrev').style.display = ''; };
    r.readAsDataURL(f);
  };

  $('print').onclick = function () {
    if (!$('name').value.trim()) {
      $('msg').textContent = 'Add a name before printing.';
      $('msg').className = 'out bad';
      return;
    }
    $('msg').textContent = '';
    window.print();
  };

  $('reset').onclick = function () {
    if (!confirm('Clear the form?')) return;
    document.querySelectorAll('.card input[type=text], .card textarea').forEach(function (i) { i.value = ''; });
    document.querySelectorAll('.card input[type=date]').forEach(function (i) { i.value = ''; });
    $('religion').value = 'Hindu'; $('motherTongue').value = 'Nepali';
    $('photoPrev').style.display = 'none';
    render();
  };

  render();
})();
</script>

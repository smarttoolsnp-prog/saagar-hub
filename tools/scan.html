<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var pages = [];       /* {canvas, url} */
  var filter = 'original';
  var stream = null;

  function msg(t, bad, ok) {
    $('msg').textContent = t || '';
    $('msg').className = bad ? 'out bad' : (ok ? 'out ok' : 'out');
  }

  /* ---------------- apply a filter to a canvas ---------------- */
  function applyFilter(src, kind) {
    var c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    var ctx = c.getContext('2d');
    ctx.drawImage(src, 0, 0);

    if (kind === 'original') return c;

    var imgData = ctx.getImageData(0, 0, c.width, c.height);
    var d = imgData.data;

    for (var i = 0; i < d.length; i += 4) {
      var r = d[i], g = d[i + 1], b = d[i + 2];
      var lum = 0.299 * r + 0.587 * g + 0.114 * b;

      if (kind === 'gray') {
        d[i] = d[i + 1] = d[i + 2] = lum;
      } else if (kind === 'bw') {
        var v = lum > 150 ? 255 : (lum > 100 ? 200 : 0);
        d[i] = d[i + 1] = d[i + 2] = v;
      } else if (kind === 'enhance') {
        /* strong contrast curve around mid-grey */
        var e = (lum - 128) * 1.55 + 128;
        e = Math.max(0, Math.min(255, e));
        d[i] = d[i + 1] = d[i + 2] = e;
      } else if (kind === 'warm') {
        /* flatten shadows: pull dark pixels up, keep light paper white */
        var w = lum < 110 ? 255 - (255 - lum) * 0.45 : Math.min(255, lum * 1.12);
        d[i] = d[i + 1] = d[i + 2] = Math.max(0, Math.min(255, w));
      }
    }
    ctx.putImageData(imgData, 0, 0);
    return c;
  }

  function addFromImage(im) {
    /* scale down big camera images for speed */
    var maxDim = 1800;
    var s = Math.min(1, maxDim / Math.max(im.width, im.height));
    var base = document.createElement('canvas');
    base.width = Math.round(im.width * s);
    base.height = Math.round(im.height * s);
    base.getContext('2d').drawImage(im, 0, 0, base.width, base.height);
    pages.push(base);
    redraw();
    $('listCard').classList.remove('hidden');
    msg('');
  }

  function redraw() {
    var w = $('scanlist');
    w.innerHTML = '';
    pages.forEach(function (base, i) {
      var c = applyFilter(base, filter);
      var d = document.createElement('div');
      d.className = 'sp';
      var img = document.createElement('img');
      img.src = c.toDataURL('image/jpeg', 0.75);
      img.alt = 'Page ' + (i + 1);
      d.appendChild(img);
      var n = document.createElement('div');
      n.className = 'n';
      n.textContent = 'Page ' + (i + 1);
      d.appendChild(n);
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = '×';
      b.onclick = function () { pages.splice(i, 1); redraw(); if (!pages.length) $('listCard').classList.add('hidden'); };
      d.appendChild(b);
      w.appendChild(d);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function (b) {
    b.onclick = function () {
      filter = b.getAttribute('data-f');
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function (x) { x.className = ''; });
      b.className = 'on';
      redraw();
    };
  });

  /* ---------------- camera ---------------- */
  $('camBtn').onclick = function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg('This browser cannot open the camera — use the upload option instead.', true);
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 } } })
      .then(function (s) {
        stream = s;
        $('cam').srcObject = s;
        $('camWrap').classList.remove('hidden');
        msg('Camera ready — frame the page and capture.', false, true);
      })
      .catch(function () {
        msg('Camera permission was refused. You can still upload photos.', true);
      });
  };

  function stopCam() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    $('camWrap').classList.add('hidden');
  }
  $('camOff').onclick = stopCam;

  $('shoot').onclick = function () {
    var v = $('cam');
    if (!stream) return;
    var c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    var im = new Image();
    im.onload = function () { addFromImage(im); };
    im.src = c.toDataURL('image/jpeg', 0.95);
  };

  $('file').onchange = function () {
    Array.prototype.forEach.call(this.files, function (f) {
      var im = new Image();
      im.onload = function () { addFromImage(im); };
      im.src = URL.createObjectURL(f);
    });
    this.value = '';
  };

  /* ---------------- export ---------------- */
  $('makePdf').onclick = function () {
    if (!pages.length) { msg('Add at least one page first.', true); return; }
    var items = pages.map(function (base) {
      var c = applyFilter(base, filter);
      return SAAGAR_PDF.canvasPage(c, 0.85);
    });
    SAAGAR_PDF.fromImages(items, { page: $('page').value, margin: 20 })
      .then(function (blob) {
        SAAGAR.downloadBlob(blob, 'scanned-document.pdf');
        msg('Saved scanned-document.pdf with ' + pages.length + ' page(s).', false, true);
      })
      .catch(function () { msg('Could not build the PDF.', true); });
  };

  $('savePng').onclick = function () {
    if (!pages.length) { msg('Add a page first.', true); return; }
    var c = applyFilter(pages[pages.length - 1], filter);
    c.toBlob(function (b) {
      SAAGAR.downloadBlob(b, 'scanned-page.png');
      msg('Saved the last page as PNG.', false, true);
    }, 'image/png');
  };
})();
</script>

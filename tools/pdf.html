<main class="sec">
  <div class="wrap" style="max-width:820px;">
    <div class="card">
      <div class="tabs">
        <button id="tabImg" class="on" type="button">📷 Photos → PDF</button>
        <button id="tabTxt" type="button">✍️ Text → PDF</button>
      </div>

      <!-- images -->
      <div id="paneImg">
        <div class="row">
          <div class="field" style="flex:2;">
            <label for="files">Choose one or more photos</label>
            <input type="file" id="files" accept="image/*" multiple style="padding:8px;">
          </div>
          <div class="field" style="flex:1;">
            <label for="page">Page size</label>
            <select id="page">
              <option value="a4" selected>A4 portrait</option>
              <option value="a4l">A4 landscape</option>
              <option value="letter">Letter portrait</option>
            </select>
          </div>
          <div class="field" style="flex:1;">
            <label for="margin">Margin (mm)</label>
            <input type="number" id="margin" value="10" min="0" max="40">
          </div>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="row mt">
          <button class="btn" id="makeImg" type="button" style="flex:0 0 auto;">Create PDF</button>
          <button class="btn ghost" id="clearImg" type="button" style="flex:0 0 auto;">Clear all</button>
        </div>
      </div>

      <!-- text -->
      <div id="paneTxt" class="hidden">
        <div class="field">
          <label for="titleTxt">Title (optional)</label>
          <input type="text" id="titleTxt" placeholder="e.g. Application for leave">
        </div>
        <div class="field mt">
          <label for="body">Your text — Nepali, English, or both</label>
          <textarea id="body" rows="10" placeholder="Type or paste your text here. Line breaks are kept, long lines wrap automatically."></textarea>
        </div>
        <div class="row">
          <div class="field"><label for="fontSize">Font size</label><input type="number" id="fontSize" value="13" min="8" max="30"></div>
          <div class="field"><label for="page2">Page size</label>
            <select id="page2"><option value="a4" selected>A4 portrait</option><option value="letter">Letter portrait</option></select>
          </div>
          <div class="field"><label for="align">Alignment</label>
            <select id="align"><option value="left" selected>Left</option><option value="justify">Justified</option><option value="center">Centre</option></select>
          </div>
        </div>
        <button class="btn block mt" id="makeTxt" type="button">Preview &amp; create PDF</button>
        <div class="previewPane mt" id="previewTxt"></div>
      </div>

      <div class="out" id="msg" role="status"></div>
    </div>

    <div class="card">
      <h2><span class="em">🔒</span> Private by design</h2>
      <p class="muted">Your photos and text are processed on your own device and never uploaded anywhere. That is why the PDF appears instantly even on a slow connection.</p>
    </div>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var items = [];   /* {img, url, w, h} */

  function tab(imgMode) {
    $('tabImg').className = imgMode ? 'on' : '';
    $('tabTxt').className = imgMode ? '' : 'on';
    $('paneImg').classList.toggle('hidden', !imgMode);
    $('paneTxt').classList.toggle('hidden', imgMode);
    $('msg').textContent = '';
  }
  $('tabImg').onclick = function () { tab(true); };
  $('tabTxt').onclick = function () { tab(false); };

  /* ---------------- photos ---------------- */
  $('files').onchange = function () {
    Array.prototype.forEach.call(this.files, function (f) {
      var url = URL.createObjectURL(f);
      var im = new Image();
      im.onload = function () {
        items.push({ img: im, url: url, w: im.width, h: im.height });
        drawThumbs();
      };
      im.src = url;
    });
    this.value = '';
  };

  function drawThumbs() {
    var w = $('thumbs');
    w.innerHTML = '';
    items.forEach(function (it, i) {
      var d = document.createElement('div');
      d.className = 'th';
      d.innerHTML = '<img src="' + it.url + '" alt="page ' + (i + 1) + '"><div class="n">Page ' + (i + 1) + '</div>' +
        '<button type="button" title="Remove">×</button>';
      d.querySelector('button').onclick = function () { items.splice(i, 1); drawThumbs(); };
      w.appendChild(d);
    });
  }

  $('clearImg').onclick = function () { items = []; drawThumbs(); $('msg').textContent = ''; };

  function pageKey() { return $('page').value; }

  $('makeImg').onclick = function () {
    if (!items.length) { msg('Add at least one photo first.', true); return; }
    var marginMm = parseFloat($('margin').value) || 0;
    var marginPt = marginMm / 25.4 * 72;
    var pages = items.map(function (it) {
      var maxPx = 1600;
      var scale = Math.min(1, maxPx / Math.max(it.w, it.h));
      var c = document.createElement('canvas');
      c.width = Math.round(it.w * scale);
      c.height = Math.round(it.h * scale);
      var ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(it.img, 0, 0, c.width, c.height);
      return SAAGAR_PDF.canvasPage(c, 0.9);
    });
    SAAGAR_PDF.fromImages(pages, { page: pageKey(), margin: marginPt })
      .then(function (blob) {
        SAAGAR.downloadBlob(blob, 'saagar-photos.pdf');
        msg('PDF created with ' + pages.length + ' page' + (pages.length > 1 ? 's' : '') + '. Check your downloads.', false, true);
      })
      .catch(function () { msg('Could not build the PDF — try fewer or smaller images.', true); });
  };

  /* ---------------- text ---------------- */
  function layout(text, opts) {
    var sizes = SAAGAR_PDF.PAGE_SIZES[opts.page] || SAAGAR_PDF.PAGE_SIZES.a4;
    var dpi = 150;
    var scale = dpi / 72;
    var W = Math.round(sizes.w * scale), H = Math.round(sizes.h * scale);
    var margin = Math.round(56 * scale / 2);
    var lineH = Math.round(opts.fontSize * scale * 1.55);
    var font = opts.fontSize * scale + 'px "Segoe UI",system-ui,"Noto Sans Devanagari","Nirmala UI",Arial,sans-serif';

    var measure = document.createElement('canvas').getContext('2d');
    measure.font = font;

    var pages = [];
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    ctx.font = font;
    ctx.fillStyle = '#12233a';
    ctx.textBaseline = 'top';
    var y = margin;

    function newPage() {
      pages.push(c);
      c = document.createElement('canvas');
      c.width = W; c.height = H;
      ctx = c.getContext('2d');
      ctx.font = font;
      ctx.fillStyle = '#12233a';
      ctx.textBaseline = 'top';
      y = margin;
    }

    if (opts.title) {
      var ts = opts.fontSize * 1.7;
      ctx.font = 'bold ' + (ts * scale) + 'px "Segoe UI",system-ui,"Noto Sans Devanagari",Arial,sans-serif';
      ctx.fillText(opts.title, margin, y);
      y += Math.round(ts * scale * 1.8);
      ctx.font = font;
    }

    var maxW = W - margin * 2;
    text.split('\n').forEach(function (para) {
      if (!para.trim()) { y += lineH; return; }
      var words = para.split(/\s+/);
      var line = '';
      words.forEach(function (word) {
        var test = line ? line + ' ' + word : word;
        if (measure.measureText(test).width > maxW && line) {
          if (y + lineH > H - margin) newPage();
          ctx.fillText(line, opts.align === 'center' ? (W - measure.measureText(line).width) / 2 : margin, y);
          y += lineH;
          line = word;
        } else line = test;
      });
      if (line) {
        if (y + lineH > H - margin) newPage();
        ctx.fillText(line, opts.align === 'center' ? (W - measure.measureText(line).width) / 2 : margin, y);
        y += lineH;
      }
      y += Math.round(lineH * 0.35);
    });
    pages.push(c);
    return pages;
  }

  function previewPages(pages) {
    var pane = $('previewTxt');
    pane.innerHTML = '';
    pages.slice(0, 3).forEach(function (c, i) {
      var im = document.createElement('img');
      im.className = 'pg';
      im.src = c.toDataURL('image/jpeg', 0.7);
      im.alt = 'Page ' + (i + 1);
      pane.appendChild(im);
    });
    if (pages.length > 3) {
      var p = document.createElement('p');
      p.className = 'muted center';
      p.textContent = '…and ' + (pages.length - 3) + ' more page(s).';
      pane.appendChild(p);
    }
  }

  $('makeTxt').onclick = function () {
    var text = $('body').value;
    if (!text.trim()) { msg('Type some text first.', true); return; }
    var opts = {
      title: $('titleTxt').value.trim(),
      fontSize: parseFloat($('fontSize').value) || 13,
      page: $('page2').value,
      align: $('align').value
    };
    var pages = layout(text, opts);
    previewPages(pages);
    var items = pages.map(function (c) { return SAAGAR_PDF.canvasPage(c, 0.88); });
    SAAGAR_PDF.fromImages(items, { page: opts.page, margin: 0 })
      .then(function (blob) {
        SAAGAR.downloadBlob(blob, 'saagar-document.pdf');
        msg('PDF created — ' + pages.length + ' page' + (pages.length > 1 ? 's' : '') + '. Preview below.', false, true);
      })
      .catch(function () { msg('Could not build the PDF.', true); });
  };

  function msg(t, bad, ok) {
    $('msg').textContent = t || '';
    $('msg').className = bad ? 'out bad' : (ok ? 'out ok' : 'out');
  }
})();
</script>
